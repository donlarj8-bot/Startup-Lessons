<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Edit lessons</title>
<style>
  :root {
    --bg: #EEECE7;
    --ink: #1D1B1A;
    --muted: #7A746C;
    --rule: #CFCAC1;
    --accent: #5A1F3D;
    --on-accent: #EEECE7;
    --danger: #9B2C2C;
    --font: Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --ink: #E9E5DD;
      --muted: #8D867C;
      --rule: #34312E;
      --accent: #C9A0B4;
      --on-accent: #141312;
      --danger: #E08A8A;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 1.05rem; line-height: 1.5;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 5.5rem 1.25rem 8rem; }
  p.hint { color: var(--muted); font-size: 0.95rem; margin: 0 0 1rem; }

  input, textarea {
    width: 100%; font: inherit; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--rule); padding: 0.45rem 0; border-radius: 0;
  }
  textarea { resize: vertical; min-height: 3.2rem; }
  input:focus, textarea:focus { outline: none; border-bottom-color: var(--accent); }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 0.8rem; }

  button {
    font: inherit; cursor: pointer; background: transparent; color: var(--ink);
    border: 1px solid var(--rule); padding: 0.45rem 0.9rem; border-radius: 2px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }

  .row { border-top: 1px solid var(--rule); padding: 1.4rem 0; scroll-margin-top: 5rem; }
  .row:last-of-type { border-bottom: 1px solid var(--rule); }
  .rownum { font-size: 0.85rem; color: var(--accent); letter-spacing: 0.08em; }
  .tools { display: flex; gap: 0.5rem; margin-top: 0.9rem; flex-wrap: wrap; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--rule);
    padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1.25rem 0.75rem;
  }
  .top-inner {
    max-width: 40rem; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  }
  .top h1 { font-size: 0.75rem; letter-spacing: 0.3em; font-weight: 400; color: var(--muted); margin: 0; }
  .top-actions { display: flex; align-items: center; gap: 0.9rem; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-top: 1px solid var(--rule); padding: 0.8rem 1.25rem calc(0.8rem + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 0.6rem; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  #status { font-size: 0.9rem; color: var(--muted); min-width: 8rem; text-align: center; }
  #status.err { color: var(--danger); }
  .link { border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>EDIT LESSONS</h1>
    <div class="top-actions" id="topActions" hidden>
      <button class="link" id="signout">Sign out</button>
      <button class="primary" id="add">+ Add lesson</button>
    </div>
  </div>
</header>

<main>
  <!-- Step 1: key -->
  <section id="login" hidden>
    <p class="hint">Paste your GitHub access key. It is saved only in this browser, never on the website.</p>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="tools"><button class="primary" id="connect">Connect</button></div>
    <p class="hint" id="loginerr" style="margin-top:1rem"></p>
  </section>

  <!-- Step 2: editor -->
  <section id="editor" hidden>
    <div id="rows"></div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <span id="status">Loaded</span>
  <button class="primary" id="save">Save changes</button>
</div>

<script>
  var OWNER = 'donlarj8-bot';
  var REPO = 'Startup-Lessons';
  var PATH = 'lessons.json';
  var BRANCH = 'main';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH;

  var token = '';
  var sha = '';
  var lessons = [];
  var dirty = false;

  var $ = function (id) { return document.getElementById(id); };

  function headers() {
    return { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };
  }

  function setStatus(text, isErr) {
    var s = $('status');
    s.textContent = text;
    s.className = isErr ? 'err' : '';
  }

  function markDirty() {
    dirty = true;
    setStatus('Unsaved changes');
  }

  function decodeB64(b64) {
    var bin = atob(b64.replace(/\n/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function encodeB64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function show(which) {
    $('login').hidden = which !== 'login';
    $('editor').hidden = which !== 'editor';
    $('bar').hidden = which !== 'editor';
    $('topActions').hidden = which !== 'editor';
  }

  function load() {
    setStatus('Loading...');
    return fetch(API + '?ref=' + BRANCH, { headers: headers(), cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('That key was rejected. Check it has Contents: Read and write for this repo.');
        if (r.status === 404) throw new Error('lessons.json not found in the repo, or the key cannot see this repo.');
        if (!r.ok) throw new Error('GitHub error ' + r.status);
        return r.json();
      })
      .then(function (data) {
        sha = data.sha;
        lessons = JSON.parse(decodeB64(data.content));
        dirty = false;
        draw();
        show('editor');
        setStatus('Loaded');
      });
  }

  function draw() {
    var rows = $('rows');
    rows.innerHTML = '';
    lessons.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'row';

      var n = document.createElement('div');
      n.className = 'rownum';
      n.textContent = 'Lesson ' + (i + 1);
      row.appendChild(n);

      row.appendChild(field('Lesson', 'textarea', item.lesson, function (v) { item.lesson = v; }));
      row.appendChild(field('Source (a name)', 'input', item.source, function (v) { item.source = v; }));
      row.appendChild(field('Link (optional)', 'input', item.url, function (v) { item.url = v; }));

      var tools = document.createElement('div');
      tools.className = 'tools';
      tools.appendChild(btn('Move up', function () { move(i, -1); }, i === 0));
      tools.appendChild(btn('Move down', function () { move(i, 1); }, i === lessons.length - 1));
      var del = btn('Delete', function () {
        if (confirm('Delete lesson ' + (i + 1) + '?')) {
          lessons.splice(i, 1); markDirty(); draw();
        }
      });
      del.className = 'danger';
      tools.appendChild(del);
      row.appendChild(tools);

      rows.appendChild(row);
    });
  }

  function field(label, tag, value, onChange) {
    var wrap = document.createElement('div');
    var l = document.createElement('label');
    l.textContent = label;
    var el = document.createElement(tag);
    el.value = value || '';
    if (tag === 'input') el.type = 'text';
    el.addEventListener('input', function () { onChange(el.value); markDirty(); });
    wrap.appendChild(l);
    wrap.appendChild(el);
    return wrap;
  }

  function btn(text, fn, disabled) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.disabled = !!disabled;
    b.addEventListener('click', fn);
    return b;
  }

  function move(i, dir) {
    var j = i + dir;
    if (j < 0 || j >= lessons.length) return;
    var t = lessons[i]; lessons[i] = lessons[j]; lessons[j] = t;
    markDirty(); draw();
  }

  $('add').addEventListener('click', function () {
    lessons.push({ lesson: '', source: '', url: '' });
    markDirty(); draw();
    var rows = document.querySelectorAll('#rows .row');
    var last = rows[rows.length - 1];
    if (last) {
      last.scrollIntoView({ block: 'start' });
      var area = last.querySelector('textarea');
      if (area) area.focus({ preventScroll: true });
    }
  });

  $('save').addEventListener('click', function () {
    var clean = lessons
      .map(function (x) {
        return {
          lesson: (x.lesson || '').trim(),
          source: (x.source || '').trim(),
          url: (x.url || '').trim()
        };
      })
      .filter(function (x) { return x.lesson; });

    for (var i = 0; i < clean.length; i++) {
      if (clean[i].url && !/^https?:\/\//i.test(clean[i].url)) {
        setStatus('A link must start with http:// or https://', true);
        return;
      }
    }

    $('save').disabled = true;
    setStatus('Saving...');
    fetch(API, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
      body: JSON.stringify({
        message: 'Update lessons',
        content: encodeB64(JSON.stringify(clean, null, 2) + '\n'),
        sha: sha,
        branch: BRANCH
      })
    })
      .then(function (r) {
        if (r.status === 409 || r.status === 422) throw new Error('The file changed elsewhere. Reload this page and try again.');
        if (r.status === 401 || r.status === 403) throw new Error('Key rejected. It needs Contents: Read and write.');
        if (!r.ok) throw new Error('GitHub error ' + r.status);
        return r.json();
      })
      .then(function (data) {
        sha = data.content.sha;
        lessons = clean;
        dirty = false;
        draw();
        setStatus('Saved. Live in about a minute.');
      })
      .catch(function (e) { setStatus(e.message, true); })
      .then(function () { $('save').disabled = false; });
  });

  $('connect').addEventListener('click', function () {
    var t = $('token').value.trim();
    if (!t) return;
    token = t;
    $('loginerr').textContent = '';
    load().then(function () {
      try { localStorage.setItem('gh_token', t); } catch (e) {}
    }).catch(function (e) {
      $('loginerr').textContent = e.message;
      token = '';
    });
  });

  $('signout').addEventListener('click', function () {
    try { localStorage.removeItem('gh_token'); } catch (e) {}
    token = ''; $('token').value = '';
    show('login');
  });

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  (function init() {
    var saved = '';
    try { saved = localStorage.getItem('gh_token') || ''; } catch (e) {}
    if (saved) {
      token = saved;
      load().catch(function (e) {
        token = '';
        show('login');
        $('loginerr').textContent = e.message;
      });
    } else {
      show('login');
    }
  })();
</script>
</body>
</html>
