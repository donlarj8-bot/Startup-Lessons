<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Lessons by Deepak Lead</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --muted: #6B6B6B;
    --rule: #E6E6E6;
    --accent: #5A1F3D;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --display: 'Sora', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 90%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.05rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fixed header ---------- */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid transparent;
    padding: calc(1.6rem + env(safe-area-inset-top, 0px)) 1.5rem 1.1rem;
  }
  .hdr.compact {
    border-bottom-color: var(--rule);
    padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1.5rem 0.75rem;
  }

  .hdr-in {
    max-width: 40rem; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 1rem;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 2.3rem;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin: 0;
    flex: 0 0 100%;
    color: var(--ink);
  }

  .rule { flex: 0 0 100%; }
  .rule::before {
    content: ''; display: block; width: 3rem; height: 2px;
    background: var(--accent); margin: 1.1rem 0 0.9rem;
  }

  .meta {
    display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap;
    font-size: 0.95rem; color: var(--muted);
  }
  .by strong { color: var(--ink); font-weight: 500; }
  .count strong { color: var(--ink); font-weight: 600; }
  .count:not(:empty) { padding-left: 0.9rem; border-left: 1px solid var(--rule); }

  /* compact state while scrolling */
  .hdr.compact .hdr-in { flex-wrap: nowrap; align-items: center; justify-content: space-between; }
  .hdr.compact h1 { flex: 0 1 auto; font-size: 1.2rem; letter-spacing: -0.02em; }
  .hdr.compact .rule, .hdr.compact .by { display: none; }
  .hdr.compact .count { padding-left: 0; border-left: 0; white-space: nowrap; }

  /* ---------- Lessons ---------- */
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 9rem 1.5rem 5rem;
  }

  ol { list-style: none; margin: 0; padding: 0; }

  li {
    display: grid;
    grid-template-columns: 3.5rem 1fr;
    column-gap: 0.5rem;
    padding: 1.75rem 0;
    border-top: 1px solid var(--rule);
  }
  li:last-child { border-bottom: 1px solid var(--rule); }

  .num {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--accent);
    padding-top: 0.15rem;
  }

  .lesson {
    margin: 0;
    font-size: 1.2rem;
    line-height: 1.5;
    font-weight: 500;
    white-space: pre-line;
  }

  .source { margin: 0.6rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .source a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    text-decoration-color: #BDBDBD;
  }
  .source a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .msg { color: var(--muted); }

  @media (max-width: 480px) {
    .hdr, .hdr.compact { padding-left: 1.25rem; padding-right: 1.25rem; }
    main { padding-left: 1.25rem; padding-right: 1.25rem; }
    h1 { font-size: 1.9rem; }
    li { grid-template-columns: 2.8rem 1fr; }
    .lesson { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <h1>Startup Lessons</h1>
    <div class="rule"></div>
    <div class="meta">
      <span class="by">by <strong>Deepak Lead</strong></span>
      <span class="count" id="count"></span>
    </div>
  </div>
</header>

<main id="main">
  <ol id="list"></ol>
</main>

<script>
  var hdr = document.getElementById('hdr');
  var main = document.getElementById('main');

  /* keep lessons clear of the fixed header (measured in its full-size state) */
  function setPad() {
    var wasCompact = hdr.classList.contains('compact');
    if (wasCompact) hdr.classList.remove('compact');
    main.style.paddingTop = (hdr.offsetHeight + 24) + 'px';
    if (wasCompact) hdr.classList.add('compact');
  }

  /* shrink the header once you scroll (with a gap so it never flickers) */
  var compact = false;
  function onScroll() {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (!compact && y > 70) { compact = true; hdr.classList.add('compact'); }
    else if (compact && y < 20) { compact = false; hdr.classList.remove('compact'); }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', setPad);
  setPad();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setPad);

  function roman(n) {
    var map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
               [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    var out = '';
    map.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
    return out;
  }

  function render(items) {
    var list = document.getElementById('list');
    list.innerHTML = '';

    var c = document.getElementById('count');
    c.innerHTML = '';
    var strong = document.createElement('strong');
    strong.textContent = items.length;
    c.appendChild(strong);
    c.appendChild(document.createTextNode(items.length === 1 ? ' startup lesson' : ' startup lessons'));

    items.forEach(function (item, i) {
      var li = document.createElement('li');

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = roman(i + 1);

      var box = document.createElement('div');

      var p = document.createElement('p');
      p.className = 'lesson';
      p.textContent = item.lesson || '';
      box.appendChild(p);

      if (item.source) {
        var s = document.createElement('p');
        s.className = 'source';
        if (item.url && /^https?:\/\//i.test(item.url)) {
          var a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = item.source;
          s.appendChild(a);
        } else {
          s.textContent = item.source;
        }
        box.appendChild(s);
      }

      li.appendChild(num);
      li.appendChild(box);
      list.appendChild(li);
    });

    setPad();
  }

  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('list').innerHTML = '<p class="msg">Lessons could not be loaded. Refresh the page.</p>';
    });
</script>
</body>
</html>
