<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup Lessons</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEECE7;
    --ink: #1D1B1A;
    --muted: #7A746C;
    --rule: #CFCAC1;
    --accent: #5A1F3D;
    --display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
    --body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --ink: #E9E5DD;
      --muted: #8D867C;
      --rule: #34312E;
      --accent: #C9A0B4;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.3rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 5rem;
    animation: rise 0.9s ease-out both;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 0.8rem;
    letter-spacing: 0.32em;
    margin: 0 0 3.5rem;
    color: var(--muted);
  }

  ol { list-style: none; margin: 0; padding: 0; }

  li {
    display: grid;
    grid-template-columns: 4rem 1fr;
    column-gap: 0.5rem;
    padding: 2rem 0;
    border-top: 1px solid var(--rule);
  }
  li:last-child { border-bottom: 1px solid var(--rule); }

  .num {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    padding-top: 0.3rem;
  }

  .lesson { margin: 0; font-size: 1.45rem; line-height: 1.4; font-weight: 500; }

  .source {
    margin: 0.6rem 0 0;
    font-style: italic;
    color: var(--muted);
    font-size: 1.1rem;
  }
  .source a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    text-decoration-color: var(--rule);
  }
  .source a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .msg { color: var(--muted); font-style: italic; }

  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  @media (max-width: 480px) {
    main { padding-top: 3rem; }
    li { grid-template-columns: 3.2rem 1fr; }
    .lesson { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<main>
  <h1>STARTUP LESSONS</h1>
  <ol id="list"></ol>
</main>

<script>
  function roman(n) {
    var map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
               [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    var out = '';
    map.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
    return out;
  }

  function render(items) {
    var list = document.getElementById('list');
    list.innerHTML = '';
    items.forEach(function (item, i) {
      var li = document.createElement('li');

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = roman(i + 1);

      var box = document.createElement('div');

      var p = document.createElement('p');
      p.className = 'lesson';
      p.textContent = item.lesson || '';
      box.appendChild(p);

      if (item.source) {
        var s = document.createElement('p');
        s.className = 'source';
        if (item.url && /^https?:\/\//i.test(item.url)) {
          var a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = item.source;
          s.appendChild(a);
        } else {
          s.textContent = item.source;
        }
        box.appendChild(s);
      }

      li.appendChild(num);
      li.appendChild(box);
      list.appendChild(li);
    });
  }

  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('list').innerHTML = '<p class="msg">Lessons could not be loaded. Refresh the page.</p>';
    });
</script>
</body>
</html>
