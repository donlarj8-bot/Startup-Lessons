<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Lessons by Deepak Lead</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --muted: #6B6B6B;
    --rule: #E6E6E6;
    --accent: #5A1F3D;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --display: 'Sora', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 90%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.05rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  html.booting main, html.booting .swipe-wrap { visibility: hidden; }
  html.swipe-on, html.swipe-on body { overflow: hidden; height: 100%; }
  html.swipe-on main { display: none; }

  /* ---------- Fixed header ---------- */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid transparent;
    padding: calc(1.6rem + env(safe-area-inset-top, 0px)) 1.5rem 1.1rem;
  }
  .hdr.compact {
    border-bottom-color: var(--rule);
    padding: calc(0.65rem + env(safe-area-inset-top, 0px)) 1.5rem 0.65rem;
  }
  .hdr-in { max-width: 40rem; margin: 0 auto; }

  .row1 { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 2.3rem;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin: 0;
    min-width: 0;
    color: var(--ink);
  }

  .seg {
    flex: none; display: inline-flex; padding: 2px;
    border: 1px solid var(--rule); border-radius: 999px;
  }
  .seg button {
    font: inherit; font-size: 0.8rem; line-height: 1; cursor: pointer;
    border: 0; background: transparent; color: var(--muted);
    padding: 0.4rem 0.75rem; border-radius: 999px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rule::before {
    content: ''; display: block; width: 3rem; height: 2px;
    background: var(--accent); margin: 1.1rem 0 0.9rem;
  }

  .meta {
    display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap;
    font-size: 0.95rem; color: var(--muted);
  }
  .by strong { color: var(--ink); font-weight: 500; }
  .count strong { color: var(--ink); font-weight: 600; }
  .count:not(:empty) { padding-left: 0.9rem; border-left: 1px solid var(--rule); }

  /* compact state while scrolling / swiping */
  .hdr.compact h1 { font-size: 1.15rem; letter-spacing: -0.02em; }
  .hdr.compact .rule { display: none; }
  .hdr.compact .meta { font-size: 0.78rem; margin-top: 0.15rem; gap: 0.7rem; }
  .hdr.compact .count:not(:empty) { padding-left: 0.7rem; }
  .hdr.compact .seg button { font-size: 0.75rem; padding: 0.35rem 0.65rem; }

  /* ---------- Lesson text (shared by both views) ---------- */
  .num {
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--accent);
    padding-top: 0.15rem;
  }
  .lesson {
    margin: 0;
    font-size: 0.96rem;
    line-height: 1.55;
    font-weight: 500;
    white-space: pre-line;
  }
  .source { margin: 0.55rem 0 0; color: var(--muted); font-size: 0.82rem; }
  .source a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    text-decoration-color: #BDBDBD;
  }
  .source a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Scroll view ---------- */
  main { max-width: 40rem; margin: 0 auto; padding: 9rem 1.5rem 5rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    column-gap: 0.5rem;
    padding: 1.6rem 0;
    border-top: 1px solid var(--rule);
  }
  li:last-child { border-bottom: 1px solid var(--rule); }

  /* ---------- Swipe view ---------- */
  .swipe-wrap {
    display: none;
    position: fixed; left: 0; right: 0;
    top: 4rem; bottom: calc(3.6rem + env(safe-area-inset-bottom, 0px));
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .swipe-wrap::-webkit-scrollbar { display: none; }
  html.swipe-on .swipe-wrap { display: flex; }

  .card {
    flex: 0 0 100%; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow-y: auto;
    padding: 2rem 1.5rem 2rem;
  }
  .card-in { max-width: 40rem; margin: 0 auto; }
  .card .num { display: block; padding: 0 0 0.7rem; }

  .ctrl {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--bg); border-top: 1px solid var(--rule);
    padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
    align-items: center; justify-content: center; gap: 1.2rem;
  }
  html.swipe-on .ctrl { display: flex; }
  .ctrl button {
    font: inherit; font-size: 1.3rem; line-height: 1; cursor: pointer;
    width: 2.4rem; height: 2.4rem; border-radius: 50%;
    border: 1px solid var(--rule); background: transparent; color: var(--ink);
  }
  .ctrl button:disabled { opacity: 0.3; cursor: default; }
  .ctrl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #pos { min-width: 4.5rem; text-align: center; font-size: 0.85rem; color: var(--muted); }

  .msg { color: var(--muted); }

  @media (max-width: 480px) {
    .hdr, .hdr.compact { padding-left: 1.25rem; padding-right: 1.25rem; }
    main { padding-left: 1.25rem; padding-right: 1.25rem; }
    .card { padding-left: 1.25rem; padding-right: 1.25rem; }
    h1 { font-size: 1.7rem; }
    .hdr.compact h1 { font-size: 1.1rem; }
    li { grid-template-columns: 2.6rem 1fr; }
    .lesson { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="row1">
      <h1>Startup Lessons</h1>
      <div class="seg" role="group" aria-label="View mode">
        <button type="button" data-mode="scroll" aria-pressed="true">Scroll</button>
        <button type="button" data-mode="swipe" aria-pressed="false">Swipe</button>
      </div>
    </div>
    <div class="rule"></div>
    <div class="meta">
      <span class="by">by <strong>Deepak Lead</strong></span>
      <span class="count" id="count"></span>
    </div>
  </div>
</header>

<main id="main">
  <ol id="list"></ol>
</main>

<div class="swipe-wrap" id="swipe"></div>

<div class="ctrl" id="ctrl">
  <button type="button" id="prev" aria-label="Previous lesson">&#8249;</button>
  <span id="pos"></span>
  <button type="button" id="next" aria-label="Next lesson">&#8250;</button>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var hdr = $('hdr'), main = $('main'), list = $('list'), swipe = $('swipe'), pos = $('pos');
  var H = { exp: 150, cmp: 60 };
  var items = [], idx = 0, mode = 'scroll', ready = false, compact = false;
  var KEY = 'sl_state_v1', saveT, saveT2;

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  function clamp(i) { return Math.max(0, Math.min(i, Math.max(0, items.length - 1))); }

  /* ---------- remember where the reader stopped ---------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ mode: mode, index: idx })); } catch (e) {}
  }
  function loadState() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
  }

  /* ---------- header sizing ---------- */
  function measure() {
    var was = hdr.classList.contains('compact');
    hdr.classList.remove('compact');
    H.exp = hdr.offsetHeight;
    hdr.classList.add('compact');
    H.cmp = hdr.offsetHeight;
    if (!was) hdr.classList.remove('compact');
    main.style.paddingTop = (H.exp + 24) + 'px';
  }

  function roman(n) {
    var map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
               [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    var out = '';
    map.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
    return out;
  }

  /* ---------- scroll view helpers ---------- */
  function syncCompact() {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    compact = y > 70;
    hdr.classList.toggle('compact', compact);
  }

  function scrollIndex() {
    var lis = list.children, top = (compact ? H.cmp : H.exp) + 10;
    for (var i = 0; i < lis.length; i++) {
      if (lis[i].getBoundingClientRect().bottom > top + 30) return i;
    }
    return Math.max(0, lis.length - 1);
  }

  function toScrollIdx(i) {
    var lis = list.children;
    if (!lis.length) return;
    i = clamp(i);
    if (i === 0) {
      window.scrollTo(0, 0);
    } else {
      var y = lis[i].getBoundingClientRect().top + (window.pageYOffset || 0) - (H.cmp + 8);
      window.scrollTo(0, Math.max(0, y));
    }
    syncCompact();
  }

  function onScroll() {
    if (mode !== 'scroll') return;
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (!compact && y > 70) { compact = true; hdr.classList.add('compact'); }
    else if (compact && y < 20) { compact = false; hdr.classList.remove('compact'); }
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      if (!ready || mode !== 'scroll') return;
      idx = scrollIndex();
      save();
    }, 150);
  }

  /* ---------- swipe view helpers ---------- */
  function layoutSwipe() {
    measure();
    swipe.style.top = H.cmp + 'px';
  }

  function updatePos() {
    pos.textContent = items.length ? (idx + 1) + ' / ' + items.length : '';
    $('prev').disabled = idx <= 0;
    $('next').disabled = idx >= items.length - 1;
  }

  function go(n) {
    n = clamp(n);
    swipe.scrollTo({ left: n * swipe.clientWidth, behavior: 'smooth' });
  }

  swipe.addEventListener('scroll', function () {
    var w = swipe.clientWidth || 1;
    var i = clamp(Math.round(swipe.scrollLeft / w));
    if (i !== idx) { idx = i; updatePos(); }
    clearTimeout(saveT2);
    saveT2 = setTimeout(function () { if (ready && mode === 'swipe') save(); }, 200);
  }, { passive: true });

  $('prev').addEventListener('click', function () { go(idx - 1); });
  $('next').addEventListener('click', function () { go(idx + 1); });

  document.addEventListener('keydown', function (e) {
    if (mode !== 'swipe') return;
    if (e.key === 'ArrowLeft') { go(idx - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { go(idx + 1); e.preventDefault(); }
  });

  /* ---------- mode switching ---------- */
  function setMode(m, persist) {
    mode = m;
    root.classList.toggle('swipe-on', m === 'swipe');
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false');
    });
    if (m === 'swipe') {
      compact = true;
      hdr.classList.add('compact');
      layoutSwipe();
      swipe.scrollLeft = idx * swipe.clientWidth;
      updatePos();
    } else {
      measure();
      toScrollIdx(idx);
    }
    if (persist !== false) save();
  }

  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      var m = b.getAttribute('data-mode');
      if (m === mode) return;
      if (mode === 'scroll') idx = scrollIndex();
      setMode(m);
    });
  });

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    if (mode === 'swipe') {
      layoutSwipe();
      swipe.scrollLeft = idx * swipe.clientWidth;
    } else {
      measure();
    }
  });
  measure();

  /* ---------- building the lessons ---------- */
  function makeBody(item) {
    var box = document.createElement('div');

    var p = document.createElement('p');
    p.className = 'lesson';
    p.textContent = item.lesson || '';
    box.appendChild(p);

    if (item.source) {
      var s = document.createElement('p');
      s.className = 'source';
      if (item.url && /^https?:\/\//i.test(item.url)) {
        var a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = item.source;
        s.appendChild(a);
      } else {
        s.textContent = item.source;
      }
      box.appendChild(s);
    }
    return box;
  }

  function render(data) {
    items = data;
    list.innerHTML = '';
    swipe.innerHTML = '';

    var c = $('count');
    c.innerHTML = '';
    var strong = document.createElement('strong');
    strong.textContent = items.length;
    c.appendChild(strong);
    c.appendChild(document.createTextNode(items.length === 1 ? ' startup lesson' : ' startup lessons'));

    items.forEach(function (item, i) {
      /* scroll view row */
      var li = document.createElement('li');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = roman(i + 1);
      li.appendChild(num);
      li.appendChild(makeBody(item));
      list.appendChild(li);

      /* swipe view card */
      var card = document.createElement('div');
      card.className = 'card';
      var inner = document.createElement('div');
      inner.className = 'card-in';
      var n2 = document.createElement('div');
      n2.className = 'num';
      n2.textContent = roman(i + 1);
      inner.appendChild(n2);
      inner.appendChild(makeBody(item));
      card.appendChild(inner);
      swipe.appendChild(card);
    });

    /* wait for fonts so positions are exact, then jump to where they left off */
    var fontsReady = (document.fonts && document.fonts.ready)
      ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1500); })])
      : Promise.resolve();

    fontsReady.then(function () {
      measure();
      var s = loadState();
      if (s) {
        idx = clamp(parseInt(s.index, 10) || 0);
        mode = s.mode === 'swipe' ? 'swipe' : 'scroll';
      }
      setMode(mode, false);
      ready = true;
      root.classList.remove('booting');
    });
  }

  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
    .then(render)
    .catch(function () {
      list.innerHTML = '<p class="msg">Lessons could not be loaded. Refresh the page.</p>';
      root.classList.remove('booting');
    });
</script>
</body>
</html>
